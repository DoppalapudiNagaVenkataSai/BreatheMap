[project]
name = "breathemap"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "jinja2>=3.1.4",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "N", "RUF", "C90", "PL"]
ignore = [
    "S101", # allow assert in tests and typing
    "PLR0913", # allow arguments in endpoint handlers
    "PLR2004", # allow comparison constants where appropriate
    "B008", # allow Depends in FastAPI parameter defaults
    "RUF002", # allow math symbols in docstrings
    "PLR0911", # allow multiple return statements in level checks
    "PLR0917", # allow geometric coordinate arguments
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = false
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
